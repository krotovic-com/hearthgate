name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

# Title and body edits get their own group, so editing a PR never cancels
# a test run for its latest commit (edited runs skip the tests).
concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-title:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: fmt, clippy, test
    # Editing the PR title or body only needs the title check.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The runner has Docker and Compose, so the Docker tests must not skip.
      - run: cargo test --locked
        env:
          HEARTHGATE_DOCKER_TESTS: '1'
      # The firewall and VPN tests build network namespaces, load real
      # nftables rulesets and start real WireGuard tunnels, so they skip
      # without root. Run them again as root (only the test binaries, so the
      # build output stays owned by the runner).
      - name: Firewall and VPN tests in network namespaces
        run: |
          sudo apt-get install -y --no-install-recommends nftables iproute2 wireguard-tools
          cargo test --locked -p hearthgate-firewall --test netns
          cargo test --locked -p hearthgate --test vpn_netns
          cargo test --locked -p hearthgate --test vpn_docker
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
          HEARTHGATE_NETNS_TESTS: '1'
          # The VPN-to-containers test needs the runner's own network
          # namespace, where Docker runs. Throwaway runners only.
          HEARTHGATE_HOST_TESTS: '1'

  deny:
    name: dependencies (advisories, licenses, sources)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: npm audit (dashboard)
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high

  dashboard:
    name: dashboard (svelte-check, unit, end-to-end)
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Type checks, component tests, build, then end-to-end tests against
      # a Hearthgate built with this dashboard.
      - run: npm test
