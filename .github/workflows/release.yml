name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases run one at a time, in order, and are never cancelled midway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags for version detection

      - name: Compute next version
        id: version
        run: scripts/next-version.sh

      - name: No release needed
        if: steps.version.outputs.version == ''
        run: echo "Only non-releasing commits since ${{ steps.version.outputs.previous || 'the start' }}. Nothing to publish."

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.version != ''
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.version != ''

      - uses: mlugg/setup-zig@v2
        if: steps.version.outputs.version != ''
        with:
          version: 0.15.2

      - uses: taiki-e/install-action@v2
        if: steps.version.outputs.version != ''
        with:
          tool: cargo-zigbuild,git-cliff

      # install-action has no nfpm; the runner's Go builds it.
      - name: Install nfpm
        if: steps.version.outputs.version != ''
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - uses: actions/setup-node@v5
        if: steps.version.outputs.version != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Test
        if: steps.version.outputs.version != ''
        run: cargo test --locked

      - name: Build release archives
        if: steps.version.outputs.version != ''
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Sign SHA256SUMS
        if: steps.version.outputs.version != ''
        env:
          SIGNING_KEY: ${{ secrets.HEARTHGATE_SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.HEARTHGATE_SIGNING_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Installed Hearthgate checks this signature before every update
          # from the dashboard, so a release without it can't be installed.
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The HEARTHGATE_SIGNING_KEY secret is missing; releases must be signed."
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends minisign
          key="$RUNNER_TEMP/hearthgate.key"
          umask 077
          printf '%s\n' "$SIGNING_KEY" >"$key"
          printf '%s\n' "$SIGNING_KEY_PASSWORD" |
            minisign -S -s "$key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig \
              -t "hearthgate v$VERSION SHA256SUMS"
          rm -f "$key"
          minisign -V -P "$(grep -v '^untrusted' packaging/release-key.pub)" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig

      - name: Generate release notes
        if: steps.version.outputs.version != ''
        run: git cliff --unreleased --tag "${{ steps.version.outputs.tag }}" --strip all --output notes.md

      - name: Publish GitHub Release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/*.tar.gz dist/*.deb dist/*.rpm dist/install.sh dist/SHA256SUMS dist/SHA256SUMS.minisig \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md
