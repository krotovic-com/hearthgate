name: Site

# Publishes the website to GitHub Pages: the landing page from site/ at the
# root and the documentation from docs/ under /docs/ (pull requests only check
# that it builds). Needs Pages turned on with "GitHub Actions" as the source
# and the custom domain hearthgate.dev set in Settings, Pages.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'scripts/build-site.sh', '.github/workflows/docs.yml']
  pull_request:
    paths: ['site/**', 'docs/**', 'scripts/build-site.sh', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
      - run: scripts/build-site.sh
      - name: Check internal links
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = "target/site"
          bad = []
          for d, _, files in os.walk(root):
              for f in files:
                  if not f.endswith(".html"):
                      continue
                  path = os.path.join(d, f)
                  html = open(path, encoding="utf-8").read()
                  for href in re.findall(r'(?:href|src)="([^"#?]+)', html):
                      if re.match(r"^[a-z]+:|^//", href) or "{{" in href:
                          continue
                      target = os.path.join(root, href.lstrip("/")) if href.startswith("/") else os.path.join(d, href)
                      if href.endswith("/"):
                          target = os.path.join(target, "index.html")
                      if not os.path.exists(os.path.normpath(target)):
                          bad.append(f"{path}: {href}")
          print("\n".join(bad) or "all internal links resolve")
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
