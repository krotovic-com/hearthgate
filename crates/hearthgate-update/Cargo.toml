[package]
name = "hearthgate-update"
description = "Hearthgate self-update: signed release checks, downloads, and the root helper that installs and rolls back."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hearthgate-model.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
jiff = "0.2"
libc = "0.2"
minisign-verify = "0.3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
flate2 = "1"
tar = { version = "0.4", default-features = false }
tracing.workspace = true
utoipa = { workspace = true, optional = true }

[features]
openapi = ["dep:utoipa", "hearthgate-model/openapi"]

[dev-dependencies]
minisign = "0.10"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
