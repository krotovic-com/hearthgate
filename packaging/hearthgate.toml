# Hearthgate bootstrap settings: /etc/hearthgate/hearthgate.toml
#
# Only what Hearthgate needs before it can open its database lives here.
# Interfaces, services and routes are stored as revisions in the database and
# changed with `hearthgate apply FILE` or the admin API, never in this file.

# Where the state database, certificates and keys are kept.
data_dir = "/var/lib/hearthgate"

# Log filter, for example "info" or "hearthgate=debug,info".
log = "info"

[admin]
# The dashboard and admin API. By default Hearthgate listens on port 7380 of
# loopback and this machine's LAN addresses, and lets in only clients from
# loopback and those LAN networks. Change that in the dashboard (Settings,
# Dashboard access), or fix it here; setting either line below makes the
# dashboard show it read-only. Clients outside `allow` are disconnected
# before a byte is read, even if `listen` is misconfigured. `listen = []`
# turns the admin API off.
# listen = ["127.0.0.1:7380", "192.168.1.10:7380"]
# allow = ["127.0.0.0/8", "::1/128", "192.168.1.0/24"]
# Serve /metrics without the admin token (to clients in `allow`).
metrics_without_token = false
# The dashboard uses HTTPS with a self-signed certificate (its fingerprint
# is in the log and on the Settings page). Use your own, for example from
# an internal CA, with both of these:
# certificate = "/etc/hearthgate/dashboard.pem"
# private_key = "/etc/hearthgate/dashboard.key"

[docker]
# Find containers for `kind = "docker"` services, and run the containers and
# stacks of the desired state. Needs access to the Docker socket, which is
# equivalent to root: see SupplementaryGroups in the systemd unit.
enabled = true
socket = "/var/run/docker.sock"
# Only follow existing containers; never create, change or remove any.
# manage = false
