[package]
name = "hearthgate"
# Placeholder. Release versions come from Conventional Commits and are passed
# to the build as HEARTHGATE_VERSION (see scripts/build-release.sh). Do not
# bump this by hand.
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.85"
description = "Secure-by-default gateway for home servers: one way in, everything else over VPN."
license = "MIT"
repository = "https://github.com/krotovic-com/hearthgate"
homepage = "https://github.com/krotovic-com/hearthgate"
readme = "README.md"
keywords = ["gateway", "reverse-proxy", "vpn", "homelab", "firewall"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
