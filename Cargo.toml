[workspace]
resolver = "3"
members = ["hearthgate", "crates/*"]

[workspace.package]
# Placeholder. Release versions come from Conventional Commits and are passed
# to the build as HEARTHGATE_VERSION (see scripts/build-release.sh). Do not
# bump this by hand.
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/krotovic-com/hearthgate"
homepage = "https://github.com/krotovic-com/hearthgate"
publish = false

[workspace.dependencies]
hearthgate-model = { path = "crates/hearthgate-model" }
hearthgate-store = { path = "crates/hearthgate-store" }

anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
humantime = "2"
humantime-serde = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
