[workspace]
resolver = "3"
members = ["hearthgate", "crates/*"]

[workspace.package]
# Placeholder. Release versions come from Conventional Commits and are passed
# to the build as HEARTHGATE_VERSION (see scripts/build-release.sh). Do not
# bump this by hand.
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/krotovic-com/hearthgate"
publish = false

[workspace.dependencies]
hearthgate-model = { path = "crates/hearthgate-model" }
hearthgate-store = { path = "crates/hearthgate-store" }
hearthgate-proxy = { path = "crates/hearthgate-proxy" }
hearthgate-acme = { path = "crates/hearthgate-acme" }
hearthgate-services = { path = "crates/hearthgate-services" }
hearthgate-api = { path = "crates/hearthgate-api" }
hearthgate-firewall = { path = "crates/hearthgate-firewall" }
hearthgate-upnp = { path = "crates/hearthgate-upnp" }
hearthgate-vpn = { path = "crates/hearthgate-vpn" }
hearthgate-docker = { path = "crates/hearthgate-docker" }
hearthgate-notify = { path = "crates/hearthgate-notify" }
hearthgate-ai = { path = "crates/hearthgate-ai" }
hearthgate-update = { path = "crates/hearthgate-update" }

anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
arc-swap = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bollard = { version = "0.19", default-features = false, features = ["pipe"] }
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
http = "1"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.3", features = ["std"] }
hmac = "0.12"
if-addrs = "0.13"
ipnet = { version = "2", features = ["serde"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "native-tokio", "http1", "tls12", "logging"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rust-embed = { version = "8", features = ["mime-guess"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
sd-notify = "0.4"
serde_json = "1"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
similar = "2"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
utoipa = "5"
x509-parser = "0.18"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Style-only pedantic lints that add noise without catching bugs here.
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
similar_names = "allow"
bool_to_int_with_if = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
