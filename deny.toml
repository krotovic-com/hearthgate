# cargo-deny: known vulnerabilities (RustSec), licenses, banned and
# duplicate crates, and where dependencies come from.
# Run it with `cargo deny check` (see CONTRIBUTING.md).

[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Every advisory fails the check, including unmaintained crates and yanked
# versions. Exceptions go in `ignore` with a reason.
yanked = "deny"
ignore = []

[licenses]
# Licenses compatible with distributing Hearthgate under MIT.
allow = [
  "MIT",
  "MIT-0",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
